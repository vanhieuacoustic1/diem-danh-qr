<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Điểm danh QR</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f5f6f8;
  color:#1f2937
}
.wrap{
  max-width:560px;
  margin:auto;
  padding:16px
}
h1{
  text-align:center;
  font-size:25px;
  margin:10px 0 18px
}
.card{
  background:white;
  border-radius:18px;
  padding:16px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
  margin-bottom:14px
}
.activity{
  display:flex;
  gap:10px
}
button{
  border:0;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer
}
.activity button{
  flex:1;
  background:#e8edf5
}
.activity button.active{
  background:#1976d2;
  color:white
}
#reader{
  width:100%;
  margin-top:10px
}
.status{
  padding:13px;
  border-radius:12px;
  background:#f0f3f7;
  margin-top:14px;
  text-align:center
}
.ok{background:#e8f5e9;color:#166534}
.err{background:#ffebee;color:#991b1b}
.small{
  font-size:13px;
  color:#6b7280;
  margin-bottom:10px
}
</style>
</head>

<body>

<div class="wrap">

<h1>Điểm danh QR</h1>

<div class="card">
  <div class="small">Chọn hoạt động trước khi quét:</div>

  <div class="activity">
    <button id="cateBtn"
            class="active"
            onclick="setActivity('HD002')">
      📖 Học Giáo Lý
    </button>

    <button id="massBtn"
            onclick="setActivity('HD001')">
      ⛪ Đi Lễ
    </button>
  </div>
</div>

<div class="card">
  <div id="reader"></div>

  <div id="status" class="status">
    Đang khởi động camera...
  </div>
</div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbzaD30yOH5QPpE30eQP9HtEKHXmB6R7ReSAaZcPQn9JRYIIyHdcxWieA_bfQjYsDsl7/exec";

let activityCode = "HD002";
let lastCode = "";
let lastTime = 0;

function setActivity(code){

  activityCode = code;

  document
    .getElementById("cateBtn")
    .classList.toggle("active",code==="HD002");

  document
    .getElementById("massBtn")
    .classList.toggle("active",code==="HD001");

  setStatus(
    code==="HD002"
      ? "📖 Đang ở chế độ Học Giáo Lý"
      : "⛪ Đang ở chế độ Đi Lễ",
    ""
  );
}

function setStatus(text,cls){

  const el=document.getElementById("status");

  el.className="status "+(cls||"");

  el.textContent=text;
}

function beep(ok=true){

  try{

    const ctx =
      new (window.AudioContext ||
           window.webkitAudioContext)();

    const osc=ctx.createOscillator();
    const gain=ctx.createGain();

    osc.frequency.value=ok?880:220;
    gain.gain.value=.08;

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime+.12);

  }catch(e){}
}

function onScanSuccess(decodedText){

  const now=Date.now();

  if(decodedText===lastCode &&
     now-lastTime<3000){
    return;
  }

  lastCode=decodedText;
  lastTime=now;

  beep(true);

  setStatus(
    "⏳ Đang ghi điểm danh: "+decodedText,
    ""
  );

  const url =
    API+
    "?action=attendance"+
    "&code="+encodeURIComponent(decodedText)+
    "&activity="+encodeURIComponent(activityCode);

  fetch(url,{mode:"no-cors"})
    .then(()=>{

      setStatus(
        "✅ Đã quét: "+decodedText+
        " | "+
        (activityCode==="HD002"
          ?"Học Giáo Lý"
          :"Đi Lễ"),
        "ok"
      );

    })
    .catch(err=>{

      beep(false);

      setStatus(
        "⚠️ Đã quét nhưng chưa xác nhận được máy chủ.",
        "err"
      );

    });
}

function onScanError(errorMessage){
  // Không hiện lỗi liên tục khi camera đang hoạt động
}

function startCamera(){

  if(!window.Html5Qrcode){

    setStatus(
      "❌ Không tải được trình quét QR.",
      "err"
    );

    return;
  }

  const scanner =
    new Html5Qrcode("reader");

  scanner.start(
    {facingMode:"environment"},

    {
      fps:10,
      qrbox:function(width,height){

        const size=Math.min(
          Math.floor(width*0.75),
          Math.floor(height*0.75)
        );

        return {
          width:size,
          height:size
        };
      }
    },

    onScanSuccess,
    onScanError

  ).then(()=>{

    setStatus(
      "📷 Camera đã mở. Đưa mã QR vào khung để quét.",
      ""
    );

  }).catch(error=>{

    console.error(error);

    setStatus(
      "❌ Không mở được camera. Hãy cho phép Camera cho trang này rồi tải lại.",
      "err"
    );

  });
}

window.addEventListener(
  "load",
  startCamera
);

</script>

</body>
</html>
