<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điểm danh QR</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #172033;
    }

    .wrap {
      max-width: 520px;
      margin: auto;
      padding: 18px;
    }

    h1 {
      text-align: center;
      font-size: 26px;
      margin: 10px 0 18px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, .08);
    }

    .label {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .activities {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 13px 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #e8edf5;
      color: #172033;
    }

    button.active {
      background: #1976d2;
      color: white;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
    }

    #status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      background: #f0f2f5;
    }

    .success {
      background: #dff6e5 !important;
      color: #16743a;
    }

    .error {
      background: #ffe1e1 !important;
      color: #b42323;
    }

    .info {
      background: #e8f1ff !important;
      color: #1456a0;
    }

    .hidden { display: none; }

    .count {
      text-align: center;
      font-size: 15px;
      color: #667085;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>Điểm danh QR</h1>

  <div class="card">
    <div class="label">Chọn hoạt động trước khi quét:</div>

    <div class="activities">
      <button id="btnGiaoLy" onclick="chonHoatDong('Học Giáo Lý')">
        📖 Học Giáo Lý
      </button>

      <button id="btnDiLe" onclick="chonHoatDong('Đi Lễ')">
        ⛪ Đi Lễ
      </button>
    </div>
  </div>

  <div class="card">
    <div id="status">
      Vui lòng chọn hoạt động để bắt đầu quét QR.
    </div>
    <div class="count">
      Đã quét trong phiên: <b id="count">0</b>
    </div>
  </div>

  <div class="card hidden" id="cameraCard">
    <div id="reader"></div>
  </div>

</div>

<script>

  // GOOGLE APPS SCRIPT CỦA BẠN
  const API_URL =
    "https://script.google.com/macros/s/AKfycbyCoPEF_t7Z2nE9oEKvWvSW0rva756EN1_diTKwG4bwHmhdpk60ks-Jxw30qFohjWnS/exec";

  let hoatDong = "";
  let scanner = null;
  let dangGui = false;
  let count = 0;

  // Chỉ chống việc camera đọc cùng một QR liên tục trong vài giây.
  // Đây KHÔNG phải chống trùng điểm danh trong ngày.
  let maVuaQuet = "";
  let thoiDiemQuet = 0;


  function chonHoatDong(hoatDongMoi) {

    hoatDong = hoatDongMoi;

    document.getElementById("btnGiaoLy").classList.remove("active");
    document.getElementById("btnDiLe").classList.remove("active");

    if (hoatDongMoi === "Học Giáo Lý") {
      document.getElementById("btnGiaoLy").classList.add("active");
    } else {
      document.getElementById("btnDiLe").classList.add("active");
    }

    document.getElementById("status").className = "info";
    document.getElementById("status").innerHTML =
      "📷 Camera đang sẵn sàng quét liên tục...";

    document.getElementById("cameraCard").classList.remove("hidden");

    batDauQuet();
  }


  async function batDauQuet() {

    if (!hoatDong) return;

    document.getElementById("cameraCard").classList.remove("hidden");

    // Nếu camera đang chạy thì không khởi tạo lại.
    if (scanner) {
      return;
    }

    scanner = new Html5Qrcode("reader");

    try {

      await scanner.start(
        { facingMode: "environment" },

        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },

        qrCodeMessage => {
          xuLyQR(qrCodeMessage);
        },

        errorMessage => {
          // Không hiển thị lỗi khi camera đang tìm QR.
        }
      );

      document.getElementById("status").className = "info";
      document.getElementById("status").innerHTML =
        "🟢 <b>CAMERA ĐANG QUÉT</b><br>" +
        "Đưa QR tiếp theo vào khung.";

    } catch (err) {

      console.error("Camera error:", err);

      scanner = null;

      document.getElementById("status").className = "error";

      document.getElementById("status").innerHTML =
        "❌ Không mở được camera.<br><br>" +
        "Hãy cho phép Camera cho trang này rồi tải lại.";
    }
  }


  async function xuLyQR(qrData) {

    const code = String(qrData || "").trim();

    if (!code || dangGui) return;

    const now = Date.now();

    // Chỉ bỏ qua cùng một mã khi camera đọc lặp liên tục.
    // Không phải chống trùng trong ngày.
    if (
      code === maVuaQuet &&
      now - thoiDiemQuet < 2500
    ) {
      return;
    }

    maVuaQuet = code;
    thoiDiemQuet = now;
    dangGui = true;

    document.getElementById("status").className = "info";
    document.getElementById("status").innerHTML =
      "⏳ Đang ghi nhận...<br>" +
      "<b>" + escapeHtml(code) + "</b>";

    // Tạm dừng đọc trong lúc gửi, nhưng KHÔNG tắt camera.
    try {
      if (scanner) scanner.pause(true);
    } catch (e) {}

    try {

      const url =
        API_URL +
        "?qr=" + encodeURIComponent(code) +
        "&hoatdong=" + encodeURIComponent(hoatDong) +
        "&thoigian=" + encodeURIComponent(new Date().toISOString());

      const result = await goiAppsScript(url);

      if (!result || result.ok !== true) {
        throw new Error((result && result.message) || "Apps Script không ghi được điểm danh.");
      }

      count++;
      document.getElementById("count").textContent = count;

      document.getElementById("status").className = "success";
      document.getElementById("status").innerHTML =
        "✅ <b>ĐIỂM DANH THÀNH CÔNG</b><br>" +
        "<b>" + escapeHtml(result.name || code) + "</b><br>" +
        escapeHtml(result.message || hoatDong);

      beep();

    } catch (error) {

      console.error("Lỗi gửi dữ liệu:", error);

      document.getElementById("status").className = "error";
      document.getElementById("status").innerHTML =
        "❌ Không gửi được dữ liệu.<br>" +
        "Vui lòng thử lại.";

    }

    // Camera tiếp tục chạy sau một khoảng ngắn.
    setTimeout(() => {

      dangGui = false;

      try {
        if (scanner) scanner.resume();
      } catch (e) {}

      document.getElementById("status").className = "info";
      document.getElementById("status").innerHTML =
        "🟢 <b>SẴN SÀNG QUÉT TIẾP</b><br>" +
        "Đưa QR tiếp theo vào khung.";

    }, 700);
  }


  function goiAppsScript(url) {
    return new Promise(function(resolve, reject) {
      const callback = "qrCallback_" + Date.now() + "_" + Math.random().toString(36).slice(2);
      const script = document.createElement("script");
      let done = false;

      const finish = function(fn, value) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try { delete window[callback]; } catch (e) {}
        try { script.remove(); } catch (e) {}
        fn(value);
      };

      window[callback] = function(data) {
        finish(resolve, data);
      };

      script.onerror = function() {
        finish(reject, new Error("Không kết nối được Google Apps Script."));
      };

      const timer = setTimeout(function() {
        finish(reject, new Error("Google Apps Script không phản hồi."));
      }, 15000);

      script.src = url + "&callback=" + encodeURIComponent(callback) + "&_=" + Date.now();
      document.body.appendChild(script);
    });
  }

  function escapeHtml(text) {

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function beep() {

    try {

      const ctx = new (window.AudioContext || window.webkitAudioContext)();

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.frequency.value = 880;
      gain.gain.value = 0.15;

      osc.start();
      osc.stop(ctx.currentTime + 0.12);

    } catch (e) {}
  }

</script>

</body>
</html>
