<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điểm danh QR</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #172033;
    }

    .wrap {
      max-width: 520px;
      margin: auto;
      padding: 18px;
    }

    h1 {
      text-align: center;
      font-size: 26px;
      margin: 10px 0 18px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, .08);
    }

    .label {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .activities {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 13px 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #e8edf5;
      color: #172033;
    }

    button.active {
      background: #1976d2;
      color: white;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
    }

    #status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      background: #f0f2f5;
    }

    .success {
      background: #dff6e5 !important;
      color: #16743a;
    }

    .error {
      background: #ffe1e1 !important;
      color: #b42323;
    }

    .hidden {
      display: none;
    }

    .restart {
      margin-top: 12px;
      width: 100%;
      background: #1976d2;
      color: white;
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>Điểm danh QR</h1>

  <div class="card">
    <div class="label">Chọn hoạt động trước khi quét:</div>

    <div class="activities">
      <button id="btnGiaoLy" onclick="chonHoatDong('Học Giáo Lý')">
        📖 Học Giáo Lý
      </button>

      <button id="btnDiLe" onclick="chonHoatDong('Đi Lễ')">
        ⛪ Đi Lễ
      </button>
    </div>
  </div>

  <div class="card">
    <div id="status">
      Vui lòng chọn hoạt động để bắt đầu quét QR.
    </div>
  </div>

  <div class="card hidden" id="cameraCard">
    <div id="reader"></div>
  </div>

  <button class="restart hidden" id="restartBtn" onclick="batDauQuet()">
    🔄 Quét người tiếp theo
  </button>

</div>

<script>

  // GOOGLE APPS SCRIPT CỦA BẠN
  const API_URL =
    "https://script.google.com/macros/s/AKfycbzaD30yOH5QPpE30eQP9HtEKHXmB6R7ReSAaZcPQn9JRYIIyHdcxWieA_bfQjYsDsl7/exec";

  let hoatDong = "";
  let scanner = null;
  let dangGui = false;


  function chonHoatDong(hoatDongMoi) {

    hoatDong = hoatDongMoi;

    document.getElementById("btnGiaoLy").classList.remove("active");
    document.getElementById("btnDiLe").classList.remove("active");

    if (hoatDongMoi === "Học Giáo Lý") {
      document.getElementById("btnGiaoLy").classList.add("active");
    } else {
      document.getElementById("btnDiLe").classList.add("active");
    }

    document.getElementById("status").className = "";
    document.getElementById("status").innerHTML =
      "📷 Đang mở camera để quét QR...";

    document.getElementById("cameraCard").classList.remove("hidden");
    document.getElementById("restartBtn").classList.add("hidden");

    batDauQuet();
  }


  async function batDauQuet() {

    dangGui = false;

    document.getElementById("cameraCard").classList.remove("hidden");
    document.getElementById("restartBtn").classList.add("hidden");

    // Nếu scanner cũ còn tồn tại thì dừng/xóa trước
    if (scanner) {
      try {
        await scanner.stop();
      } catch (e) {}

      try {
        await scanner.clear();
      } catch (e) {}

      scanner = null;
    }

    scanner = new Html5Qrcode("reader");

    scanner.start(
      { facingMode: "environment" },

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

      qrCodeMessage => {
        if (dangGui) return;

        dangGui = true;

        xuLyQR(qrCodeMessage);
      },

      errorMessage => {
        // Không hiện lỗi liên tục khi camera đang tìm QR
      }

    ).catch(err => {

      console.error("Camera error:", err);

      document.getElementById("status").className = "error";

      document.getElementById("status").innerHTML =
        "❌ Không mở được camera.<br><br>" +
        "Hãy cho phép Camera cho trang này rồi tải lại.";

      dangGui = false;
    });
  }


  async function xuLyQR(qrData) {

    document.getElementById("status").className = "";

    document.getElementById("status").innerHTML =
      "⏳ Đang ghi nhận điểm danh...";

    try {

      if (scanner) {
        try {
          await scanner.stop();
        } catch (e) {}

        try {
          await scanner.clear();
        } catch (e) {}

        scanner = null;
      }

      const url =
        API_URL +
        "?qr=" + encodeURIComponent(qrData) +
        "&hoatdong=" + encodeURIComponent(hoatDong) +
        "&thoigian=" + encodeURIComponent(new Date().toISOString());

      /*
       * Google Apps Script có thể chuyển hướng sang một URL khác.
       * Dùng no-cors để trình duyệt gửi GET request mà không bị lỗi
       * CORS khi chạy trên GitHub Pages.
       */
      await fetch(url, {
        method: "GET",
        mode: "no-cors",
        cache: "no-store"
      });

      console.log("Đã gửi dữ liệu đến Google Apps Script:", url);

      document.getElementById("status").className = "success";

      document.getElementById("status").innerHTML =
        "✅ Điểm danh thành công!<br>" +
        "<b>" + hoatDong + "</b>";

      document.getElementById("restartBtn").classList.remove("hidden");

    } catch (error) {

      console.error("Lỗi gửi dữ liệu:", error);

      document.getElementById("status").className = "error";

      document.getElementById("status").innerHTML =
        "❌ Không gửi được dữ liệu.<br>" +
        "Vui lòng thử quét lại.";

      document.getElementById("restartBtn").classList.remove("hidden");

      dangGui = false;
    }
  }

</script>

</body>
</html>
