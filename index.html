<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Điểm danh QR</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #172033;
    }

    .wrap {
      max-width: 520px;
      margin: auto;
      padding: 18px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin: 12px 0 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    .label {
      font-size: 15px;
      margin-bottom: 10px;
    }

    .activities {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 15px 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #e8edf5;
      color: #172033;
    }

    button.active {
      background: #1976d2;
      color: white;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
    }

    #status {
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      background: #f0f2f5;
      font-size: 17px;
    }

    .success {
      background: #dff6e5 !important;
      color: #16743a;
    }

    .error {
      background: #ffe1e1 !important;
      color: #b42323;
    }

    .waiting {
      background: #fff4d6 !important;
      color: #7a5a00;
    }

    .hidden {
      display: none;
    }

    .restart {
      width: 100%;
      margin-top: 12px;
      background: #1976d2;
      color: white;
    }

    .small {
      margin-top: 8px;
      font-size: 13px;
      color: #666;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>📷 Điểm danh QR</h1>

  <div class="card">

    <div class="label">
      <b>Chọn hoạt động trước khi quét:</b>
    </div>

    <div class="activities">

      <button id="btnGiaoLy"
              onclick="chonHoatDong('Học Giáo Lý')">
        📖 Học Giáo Lý
      </button>

      <button id="btnDiLe"
              onclick="chonHoatDong('Đi Lễ')">
        ⛪ Đi Lễ
      </button>

    </div>

  </div>


  <div class="card">

    <div id="status">
      Vui lòng chọn hoạt động để bắt đầu.
    </div>

  </div>


  <div class="card hidden" id="cameraCard">

    <div id="reader"></div>

  </div>


  <button
    class="restart hidden"
    id="restartBtn"
    onclick="batDauQuet()">

    🔄 Quét người tiếp theo

  </button>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyCoPEF_t7Z2nE9oEKvWvSW0rva756EN1_diTKwG4bwHmhdpk60ks-Jxw30qFohjWnS/exec";


/* =====================================================
   BIẾN
   ===================================================== */

let hoatDong = "";
let scanner = null;
let dangXuLy = false;


/* =====================================================
   CHỌN HOẠT ĐỘNG
   ===================================================== */

function chonHoatDong(loai) {

  hoatDong = loai;

  document
    .getElementById("btnGiaoLy")
    .classList.remove("active");

  document
    .getElementById("btnDiLe")
    .classList.remove("active");


  if (loai === "Học Giáo Lý") {

    document
      .getElementById("btnGiaoLy")
      .classList.add("active");

  } else {

    document
      .getElementById("btnDiLe")
      .classList.add("active");

  }


  document.getElementById("status").className = "";

  document.getElementById("status").innerHTML =
    "📷 Đang mở camera...";


  document
    .getElementById("cameraCard")
    .classList.remove("hidden");


  document
    .getElementById("restartBtn")
    .classList.add("hidden");


  batDauQuet();
}


/* =====================================================
   MỞ CAMERA
   ===================================================== */

async function batDauQuet() {

  dangXuLy = false;


  document
    .getElementById("cameraCard")
    .classList.remove("hidden");


  document
    .getElementById("restartBtn")
    .classList.add("hidden");


  /* Dừng camera cũ */

  if (scanner) {

    try {
      await scanner.stop();
    } catch(e) {}

    try {
      await scanner.clear();
    } catch(e) {}

    scanner = null;
  }


  document.getElementById("reader").innerHTML = "";


  scanner = new Html5Qrcode("reader");


  try {

    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },

      function(qrCodeMessage) {

        if (dangXuLy) {
          return;
        }

        dangXuLy = true;

        xuLyQR(qrCodeMessage);
      },

      function(errorMessage) {
        // Bỏ qua lỗi tìm QR
      }

    );


    document.getElementById("status").className = "";

    document.getElementById("status").innerHTML =
      "📷 Camera đang hoạt động.<br>" +
      "Đưa mã QR vào khung để quét.";

  }

  catch(error) {

    console.error(error);

    document.getElementById("status").className = "error";

    document.getElementById("status").innerHTML =
      "❌ Không mở được camera.<br><br>" +
      "Hãy cho phép trình duyệt sử dụng Camera.";

    dangXuLy = false;
  }

}


/* =====================================================
   XỬ LÝ QR
   ===================================================== */

async function xuLyQR(qrData) {

  document.getElementById("status").className = "waiting";

  document.getElementById("status").innerHTML =
    "⏳ Đang gửi điểm danh...";


  /* Dừng camera */

  if (scanner) {

    try {
      await scanner.stop();
    } catch(e) {}

    try {
      await scanner.clear();
    } catch(e) {}

    scanner = null;
  }


  /*
   * Tạo URL gửi sang Apps Script
   */

  const url =
    API_URL +
    "?qr=" + encodeURIComponent(qrData) +
    "&hoatdong=" + encodeURIComponent(hoatDong) +
    "&thoigian=" + encodeURIComponent(
      new Date().toISOString()
    );


  console.log("QR:", qrData);
  console.log("URL:", url);


  /*
   * Dùng ảnh ẩn để gửi GET.
   *
   * Cách này rất ổn định với Google Apps Script
   * khi trang chạy trên GitHub Pages.
   */

  try {

    await guiDuLieu(url);


    document.getElementById("status").className = "success";

    document.getElementById("status").innerHTML =
      "✅ Đã gửi điểm danh!<br><br>" +
      "<b>" + hoatDong + "</b>";


    document
      .getElementById("restartBtn")
      .classList.remove("hidden");


  }

  catch(error) {

    console.error(error);

    document.getElementById("status").className = "error";

    document.getElementById("status").innerHTML =
      "❌ Không gửi được điểm danh.<br>" +
      "Vui lòng thử lại.";


    document
      .getElementById("restartBtn")
      .classList.remove("hidden");

    dangXuLy = false;
  }

}


/* =====================================================
   GỬI DỮ LIỆU
   ===================================================== */

function guiDuLieu(url) {

  return new Promise(function(resolve, reject) {

    const img = new Image();

    let daXuLy = false;


    function thanhCong() {

      if (daXuLy) return;

      daXuLy = true;

      resolve();

    }


    img.onload = thanhCong;

    img.onerror = function() {

      /*
       * Google Apps Script đôi khi chuyển hướng
       * nên trình duyệt có thể báo lỗi hình ảnh.
       *
       * Request vẫn đã được gửi.
       */

      if (!daXuLy) {

        daXuLy = true;

        resolve();

      }

    };


    img.src = url + "&_=" + Date.now();


    /*
     * Cho request một khoảng thời gian
     * để gửi đi.
     */

    setTimeout(function() {

      if (!daXuLy) {

        daXuLy = true;

        resolve();

      }

    }, 1500);

  });

}

</script>

</body>
</html>
