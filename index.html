<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Điểm danh QR</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #172033;
    }

    .wrap {
      max-width: 520px;
      margin: auto;
      padding: 18px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin: 10px 0 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    .label {
      font-size: 15px;
      margin-bottom: 10px;
    }

    .activities {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 13px;
      padding: 15px 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #e8edf5;
      color: #172033;
    }

    button.active {
      background: #1976d2;
      color: white;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
    }

    #status {
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      background: #f0f2f5;
      font-size: 17px;
    }

    .success {
      background: #dff6e5 !important;
      color: #16743a;
    }

    .error {
      background: #ffe1e1 !important;
      color: #b42323;
    }

    .hidden {
      display: none;
    }

    #restartBtn {
      width: 100%;
      margin-top: 5px;
      background: #1976d2;
      color: white;
    }

    .small {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>Điểm danh QR</h1>

  <div class="card">

    <div class="label">
      Chọn hoạt động trước khi quét:
    </div>

    <div class="activities">

      <button
        id="btnGiaoLy"
        onclick="chonHoatDong('Học Giáo Lý')">
        📖 Học Giáo Lý
      </button>

      <button
        id="btnDiLe"
        onclick="chonHoatDong('Đi Lễ')">
        ⛪ Đi Lễ
      </button>

    </div>

  </div>


  <div class="card">

    <div id="status">
      Vui lòng chọn hoạt động để bắt đầu quét QR.
    </div>

  </div>


  <div class="card hidden" id="cameraCard">

    <div id="reader"></div>

  </div>


  <button
    id="restartBtn"
    class="hidden"
    onclick="batDauQuet()">
    🔄 Quét người tiếp theo
  </button>

  <div class="small">
    Hệ thống điểm danh QR
  </div>

</div>


<script>

  /* =====================================================
     GOOGLE APPS SCRIPT
     ===================================================== */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbyCoPEF_t7Z2nE9oEKvWvSW0rva756EN1_diTKwG4bwHmhdpk60ks-Jxw30qFohjWnS/exec";


  /* =====================================================
     BIẾN HỆ THỐNG
     ===================================================== */

  let hoatDong = "";

  let scanner = null;

  let dangQuet = false;

  let dangGui = false;

  // Giữ tham chiếu request để trình duyệt không hủy request
  let requestImage = null;


  /* =====================================================
     CHỌN HOẠT ĐỘNG
     ===================================================== */

  function chonHoatDong(hoatDongMoi) {

    hoatDong = hoatDongMoi;

    document
      .getElementById("btnGiaoLy")
      .classList.remove("active");

    document
      .getElementById("btnDiLe")
      .classList.remove("active");


    if (hoatDongMoi === "Học Giáo Lý") {

      document
        .getElementById("btnGiaoLy")
        .classList.add("active");

    } else {

      document
        .getElementById("btnDiLe")
        .classList.add("active");

    }


    document.getElementById("status").className = "";

    document.getElementById("status").innerHTML =
      "📷 Đang mở camera...";


    document
      .getElementById("cameraCard")
      .classList.remove("hidden");


    document
      .getElementById("restartBtn")
      .classList.add("hidden");


    batDauQuet();

  }


  /* =====================================================
     BẮT ĐẦU CAMERA
     ===================================================== */

  async function batDauQuet() {

    dangGui = false;

    dangQuet = true;


    document
      .getElementById("cameraCard")
      .classList.remove("hidden");


    document
      .getElementById("restartBtn")
      .classList.add("hidden");


    /*
      Dừng scanner cũ nếu còn
    */

    if (scanner) {

      try {
        await scanner.stop();
      } catch (e) {}

      try {
        await scanner.clear();
      } catch (e) {}

      scanner = null;
    }


    /*
      Xóa reader cũ
    */

    document.getElementById("reader").innerHTML = "";


    scanner = new Html5Qrcode("reader");


    /*
      Mở camera sau
    */

    try {

      await scanner.start(

        {
          facingMode: "environment"
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }
        },


        /*
          Khi quét được QR
        */

        function(qrCodeMessage) {

          if (!dangQuet) return;

          if (dangGui) return;

          dangGui = true;

          dangQuet = false;

          xuLyQR(qrCodeMessage);

        },


        /*
          Không cần hiển thị lỗi khi camera
          đang tìm QR
        */

        function(errorMessage) {}

      );


      document.getElementById("status").className = "";

      document.getElementById("status").innerHTML =
        "📷 Đưa mã QR vào khung camera để quét.";


    } catch (error) {

      console.error(error);


      document.getElementById("status").className =
        "error";


      document.getElementById("status").innerHTML =
        "❌ Không mở được camera.<br><br>" +
        "Hãy cho phép trình duyệt sử dụng Camera " +
        "rồi tải lại trang.";


      dangQuet = false;

      dangGui = false;

    }

  }


  /* =====================================================
     XỬ LÝ QR
     ===================================================== */

  async function xuLyQR(qrData) {

    document.getElementById("status").className = "";

    document.getElementById("status").innerHTML =
      "⏳ Đang ghi nhận điểm danh...";


    /*
      Dừng camera trước khi gửi
    */

    if (scanner) {

      try {
        await scanner.stop();
      } catch (e) {}

      try {
        await scanner.clear();
      } catch (e) {}

      scanner = null;

    }


    /*
      Thời gian Việt Nam / ISO
    */

    const thoiGian =
      new Date().toISOString();


    /*
      Tạo URL gửi sang Apps Script
    */

    const url =
      API_URL +
      "?qr=" +
      encodeURIComponent(qrData) +

      "&hoatdong=" +
      encodeURIComponent(hoatDong) +

      "&thoigian=" +
      encodeURIComponent(thoiGian);


    console.log("QR:", qrData);

    console.log("Hoạt động:", hoatDong);

    console.log("URL gửi:", url);


    /*
      ------------------------------------------------
      GỬI GET TRỰC TIẾP
      ------------------------------------------------

      Không dùng fetch/no-cors nữa.

      Dùng Image để trình duyệt gửi GET request
      tới Google Apps Script.
    */

    requestImage = new Image();

    requestImage.onload = function() {

      hienThiThanhCong();

    };


    requestImage.onerror = function() {

      /*
        Với Google Apps Script, request có thể
        thành công nhưng trình duyệt không đọc
        được response do cross-origin.

        Vì vậy vẫn coi đây là request đã gửi.
      */

      hienThiThanhCong();

    };


    requestImage.src =
      url +
      "&_=" +
      Date.now();


    /*
      Nếu Google phản hồi chậm,
      vẫn báo đã gửi sau một khoảng ngắn.
    */

    setTimeout(function() {

      if (dangGui) {

        hienThiThanhCong();

      }

    }, 1500);

  }


  /* =====================================================
     HIỂN THỊ THÀNH CÔNG
     ===================================================== */

  function hienThiThanhCong() {

    if (!dangGui) return;

    dangGui = false;


    document.getElementById("status").className =
      "success";


    document.getElementById("status").innerHTML =
      "✅ Điểm danh thành công!<br><br>" +
      "<b>" + hoatDong + "</b>";


    document
      .getElementById("restartBtn")
      .classList.remove("hidden");

  }

</script>

</body>
</html>
